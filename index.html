<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arirang Lanterns | Write Your Wish</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    </head>
    <body>
    <div id="sky-bg"></div>

    <audio id="bg-music" loop preload="auto">
        <source src="arirang.mp3" type="audio/mpeg">
    </audio>
    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🔇</button>

    <div class="container">
        <div class="sub-title">ARIRANG CONCERT NIGHT</div>
        <h1 class="main-title">Sky Lanterns🏮</h1>

        <div class="box-panel">
        <p style="color: var(--cream-white); opacity: 0.9; font-size: 0.95rem; margin-bottom: 15px;">
        Write your wish: funny, serious, or purely chaotic on your silk lantern & launch it into the live community sky.
        </p>
        <input type="text" id="username" placeholder="Your Name or Bias..." maxlength="50">
        <input type="text" id="userwish" placeholder="Your Wish or Short Message..." maxlength="60">
        <br>
        <button class="btn" onclick="submitWish()">✎ᝰ Write On Lantern</button>
        </div>

        <div style="margin-top: 25px; font-size: 0.8rem; color: #887777;">
        Made with 𖹭.ᐟ by <a href="https://instagram.com/theakth" target="_blank">@theakth</a>
        </div>
    </div>

    <script src="JavaScripts/firebaseConfig.js"></script>
    <script src="JavaScripts/main.js"></script>
    </body>
</html>
